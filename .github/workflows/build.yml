name: Build firmware

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rp2040:
    name: RP2040 / RP2350 (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [pico, pico2, waveshare_rp2040_zero]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake

      - name: Fetch Pico SDK
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1 lib/tinyusb

      - name: Build
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: |
          cmake -S rp2040 -B build -DPICO_BOARD=${{ matrix.board }} -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          cp build/rp2040_hid.uf2 rp2040_hid-${{ matrix.board }}.uf2

      - name: Build with MCP3208 + 74HC165 enabled
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: |
          cp -r rp2040 "$RUNNER_TEMP/rp2040-expansion"
          sed -i 's/^#define MCP3208_ENABLED .*/#define MCP3208_ENABLED 1/; s/^#define SHIFT_REG_ENABLED .*/#define SHIFT_REG_ENABLED 1/' "$RUNNER_TEMP/rp2040-expansion/src/config.h"
          grep -q '^#define MCP3208_ENABLED 1' "$RUNNER_TEMP/rp2040-expansion/src/config.h"
          grep -q '^#define SHIFT_REG_ENABLED 1' "$RUNNER_TEMP/rp2040-expansion/src/config.h"
          cmake -S "$RUNNER_TEMP/rp2040-expansion" -B build-expansion -DPICO_BOARD=${{ matrix.board }} -DCMAKE_BUILD_TYPE=Release
          cmake --build build-expansion -j
          cp build-expansion/rp2040_hid.uf2 rp2040_hid-${{ matrix.board }}-expansion.uf2

      - uses: actions/upload-artifact@v4
        with:
          name: rp2040_hid-${{ matrix.board }}
          path: |
            rp2040_hid-${{ matrix.board }}.uf2
            rp2040_hid-${{ matrix.board }}-expansion.uf2

  arduino:
    name: Arduino (${{ matrix.fqbn }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fqbn: ["arduino:avr:leonardo", "arduino:avr:micro"]
    steps:
      - uses: actions/checkout@v4
      - name: Make a copy with MCP3208 + 74HC165 enabled
        run: |
          mkdir -p ci && cp -r arduino/HIDJoystick ci/HIDJoystickExpansion
          mv ci/HIDJoystickExpansion/HIDJoystick.ino ci/HIDJoystickExpansion/HIDJoystickExpansion.ino
          sed -i 's/^#define MCP3208_ENABLED .*/#define MCP3208_ENABLED 1/; s/^#define SHIFT_REG_ENABLED .*/#define SHIFT_REG_ENABLED 1/' ci/HIDJoystickExpansion/config.h
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          sketch-paths: |
            - arduino/HIDJoystick
            - ci/HIDJoystickExpansion

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rp2040, arduino]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.uf2"
